<!DOCTYPE html>
    <head>
      
<link rel="icon" type="image" href="favicon.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Carits — Video Editing</title>
    <style>
          </head>

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== BODY — Pure black center, orange glow ONLY at corners ===== */
        body {
            min-height: 100vh;
            background: #0a0a0a;
            /* Orange glow ONLY at the 4 corners */
            background-image: 
                radial-gradient(ellipse at 0% 0%, rgba(255, 107, 0, 0.06), transparent 50%),
                radial-gradient(ellipse at 100% 0%, rgba(255, 107, 0, 0.06), transparent 50%),
                radial-gradient(ellipse at 0% 100%, rgba(255, 107, 0, 0.06), transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(255, 107, 0, 0.06), transparent 50%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #fff;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ===== HEADER ===== */
        header {
            padding: 24px 0;
            border-bottom: 1px solid rgba(255, 107, 0, 0.06);
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #ff6b00;
        }

        nav {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ff6b00;
        }

        /* ===== INSTAGRAM BUTTON (replaces Book Now) ===== */
        .instagram-btn {
            background: #ff6b00;
            color: #0a0a0a !important;
            padding: 10px 28px;
            border-radius: 50px;
            font-weight: 700 !important;
            font-size: 14px !important;
            transition: all 0.3s;
            display: inline-block;
        }

        .instagram-btn:hover {
            background: #fff;
            color: #0a0a0a !important;
            transform: scale(1.05);
        }

        /* ===== HERO ===== */
        .hero {
            padding: 100px 0 70px;
            text-align: center;
            position: relative;
        }

        /* Subtle orange glow behind heading */
        .hero::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 250px;
            background: radial-gradient(ellipse, rgba(255, 107, 0, 0.06), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .hero * {
            position: relative;
            z-index: 1;
        }

        .hero .tag {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ff6b00;
            border: 1px solid rgba(255, 107, 0, 0.12);
            display: inline-block;
            padding: 6px 22px;
            border-radius: 50px;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: clamp(38px, 7vw, 72px);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
            color: #fff;
        }

        .hero h1 .highlight {
            color: #ff6b00;
            text-shadow: 0 0 60px rgba(255, 107, 0, 0.12);
        }

        .hero p {
            font-size: 20px;
            color: #aaa;
            max-width: 650px;
            margin: 0 auto 40px;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-block;
            background: #ff6b00;
            color: #0a0a0a;
            font-weight: 700;
            padding: 16px 44px;
            border-radius: 50px;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 107, 0, 0.15);
        }

        .btn-secondary {
            display: inline-block;
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 16px 44px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            border-color: #ff6b00;
            color: #ff6b00;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .hero {
                padding: 60px 0 40px;
            }
            .hero h1 {
                font-size: 30px;
            }
            .hero p {
                font-size: 17px;
            }
            nav {
                gap: 14px;
            }
            nav a {
                font-size: 13px;
            }
            .hero::before {
                width: 300px;
                height: 150px;
            }
            .logo {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header>
            <div class="header-inner">
                <div class="logo"><span>CARITS</span></div>
                <nav>
                    <!-- Only Contact / Instagram link -->
                    <a href="https://www.instagram.com/carits.pk?stkn=ajFvYXR1Y2gxbDRi" target="_blank" class="instagram-btn">📷 Instagram</a>
                </nav>
            </div>
        </header>

        <!-- ===== HERO ===== -->
        <section class="hero">
            <div class="tag">🎬 Premium Edits • Creative • Impact</div>
            <h1>
                We Grow <span class="highlight">Video Creators</span><br />
                With Edits That Actually Work
            </h1>
            <p>
                No music. No gimmicks. Just high-quality video editing that makes
                your content stand out — for creators, brands, and organizations.
            </p>
            <div class="hero-buttons">
                <a href="work.html" class="btn-primary">View Work</a>
                <a href="https://www.instagram.com/carits.pk?stkn=ajFvYXR1Y2gxbDRi" target="_blank" class="btn-secondary">📷 Instagram</a>
            </div>
        </section>

    </div>

</body>
</html>
